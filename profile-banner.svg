<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a1f"/>
      <stop offset="45%" stop-color="#3b0f70"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.06"/>
    </pattern>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- ambient glow behind terminal -->
  <circle cx="920" cy="160" r="220" fill="url(#glow)" filter="url(#softBlur)"/>

  <!-- left: identity block -->
  <text x="60" y="72" font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace"
        font-size="16" letter-spacing="3" fill="#67e8f9">SECURITY // AI // STUDENT</text>

  <text x="58" y="150" font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace"
        font-size="70" font-weight="700" fill="#f5f3ff">hassaansec</text>

  <text x="60" y="192" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="20" fill="#ddd6fe">Learning to think like an attacker,</text>
  <text x="60" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="20" fill="#ddd6fe">and build like a defender.</text>

  <text x="60" y="272" font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace"
        font-size="15" fill="#a78bfa">&gt; currently @ Syntecxhub — Cybersecurity &amp; AI Internship</text>

  <!-- right: terminal window -->
  <g>
    <rect x="700" y="46" width="440" height="228" rx="10" fill="#0d0716" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="700" y="46" width="440" height="32" rx="10" fill="#170f28"/>
    <rect x="700" y="62" width="440" height="16" fill="#170f28"/>

    <circle cx="722" cy="62" r="6" fill="#ff5f56"/>
    <circle cx="742" cy="62" r="6" fill="#ffbd2e"/>
    <circle cx="762" cy="62" r="6" fill="#27c93f"/>
    <text x="920" y="67" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
          font-size="12" fill="#8b8296">bash — hassaansec</text>

    <text font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace" font-size="18">
      <tspan x="722" y="112" fill="#67e8f9">$ </tspan><tspan fill="#f5f3ff">whoami</tspan>
    </text>
    <text x="722" y="140" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#a3e635">hassaansec</text>

    <text font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace" font-size="18">
      <tspan x="722" y="168" fill="#67e8f9">$ </tspan><tspan fill="#f5f3ff">cat focus.txt</tspan>
    </text>
    <text x="722" y="196" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#e9d5ff">Cybersecurity &amp; Artificial Intelligence</text>

    <text font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace" font-size="18">
      <tspan x="722" y="224" fill="#67e8f9">$ </tspan><tspan fill="#f5f3ff">_</tspan>
    </text>
    <rect x="748" y="211" width="10" height="18" fill="#67e8f9" opacity="0.85"/>
  </g>
</svg>
